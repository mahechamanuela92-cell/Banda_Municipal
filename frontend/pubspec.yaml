name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.0.0   
  audioplayers: ^6.8.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/logo.png"
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/

  fonts:
    - family: Freeman
      fonts:
       - asset: assets/fonts/Freeman-Regular.ttf