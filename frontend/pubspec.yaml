name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.0.0
  audioplayers: ^6.8.1
  image_picker: ^1.2.4
  supabase_flutter: ^2.8.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_map: ^7.0.2 
  latlong2: ^0.9.1
  flutter_pdfview: ^1.3.2 # Paquete para renderizar el PDF
  path_provider: ^2.1.2     # Necesario para copiar el PDF de assets a la memoria temporal del dispositivo

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0  # <--- Agregado para el fondo de pantalla de inicio

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo2.png" # <--- Asegúrate de que coincida con tu carpeta assets/images/
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/images/logo2.png"

# Configuración del color de fondo gris oscuro / negro para el Splash Screen
flutter_native_splash:
  color: "#121212" # Color gris oscuro / casi negro
  image: "assets/images/logo2.png"
  android_12:
    color: "#121212"
    image: "assets/images/logo2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audios/
    - assets/pdf/Manual_de_Usuario.pdf

  fonts:
    - family: Freeman
      fonts:
       - asset: assets/fonts/Freeman-Regular.ttf